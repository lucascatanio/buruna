name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east1
  BACKEND_SERVICE: buruna-backend
  FRONTEND_SERVICE: buruna-frontend
  REGISTRY: us-east1-docker.pkg.dev

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Para Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/buruna/buruna-backend:latest ./backend
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/buruna/buruna-backend:latest

      - name: Deploy backend
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/buruna/buruna-backend:latest \
            --region ${{ env.REGION }} \
            --quiet

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Para Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg VITE_HCAPTCHA_SITE_KEY=${{ vars.VITE_HCAPTCHA_SITE_KEY }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/buruna/buruna-frontend:latest \
            ./frontend
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/buruna/buruna-frontend:latest

      - name: Deploy frontend
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/buruna/buruna-frontend:latest \
            --region ${{ env.REGION }} \
            --quiet
