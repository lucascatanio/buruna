name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # O runner ubuntu-latest já vem com Docker em execução,
      # necessário para os testes de integração com Testcontainers.
      # 7zz para os testes de CBR (RAR); sem ele, esses testes são pulados
      - name: Install 7zip
        run: sudo apt-get update -q && sudo apt-get install -y -q 7zip && 7zz i > /dev/null && echo "7zz instalado"

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B clean test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build