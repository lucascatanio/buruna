name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # O runner ubuntu-latest já vem com Docker em execução,
      # necessário para os testes de integração com Testcontainers.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test
