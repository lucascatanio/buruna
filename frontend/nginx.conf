server {
    listen ${NGINX_PORT};
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512M;

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js mjs;
        application/json            json;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/svg+xml               svg;
        image/webp                  webp;
        font/woff2                  woff2;
        font/woff                   woff;
        application/octet-stream    bin;
    }

    location /api/ {
        proxy_pass https://buruna-backend-922749062176.us-east1.run.app/api/;
        proxy_set_header Host buruna-backend-922749062176.us-east1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}