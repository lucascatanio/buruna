server {
    listen ${NGINX_PORT};
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512M;

    # CSP em modo Report-Only: só registra violações no console do navegador, sem bloquear.
    # Depois de validar cadastro, 2FA, upload e leitor sem violação, trocar o nome do header
    # para Content-Security-Policy. hCaptcha: origens da documentação oficial dele. GCS: URL
    # assinada V4 (upload por PUT, leitura do PDF e das imagens).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://hcaptcha.com https://*.hcaptcha.com; frame-src https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com; img-src 'self' data: blob: https://storage.googleapis.com; font-src 'self' data:; connect-src 'self' https://storage.googleapis.com https://hcaptcha.com https://*.hcaptcha.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js mjs;
        application/json            json;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/svg+xml               svg;
        image/webp                  webp;
        font/woff2                  woff2;
        font/woff                   woff;
        application/octet-stream    bin;
    }

    location /api/ {
        proxy_pass https://buruna-backend-922749062176.us-east1.run.app/api/;
        proxy_set_header Host buruna-backend-922749062176.us-east1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}