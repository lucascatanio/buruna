events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  types {
      application/javascript  mjs;
  }
  default_type  application/octet-stream;
  client_max_body_size 600M;

  # o redirecionamento HTTP to HTTPS é feito pelo load balancer do GCP
  # (Cloud Run / GCP HTTPS Load Balancer). O nginx recebe apenas tráfego interno já
  # terminado em TLS, não há necessidade de bloco server na porta 443 aqui.

  server {
    listen 80;

    location ~* \.(js|css|woff|woff2|ttf|eot|ico|png|jpg|jpeg|svg|webp)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      proxy_pass http://frontend:8080;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass              http://frontend:8080;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_intercept_errors  on;
      error_page              404 = @fallback;
    }

    location @fallback {
      rewrite ^ /index.html break;
      proxy_pass       http://frontend:8080;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass                http://backend:8080;
      proxy_set_header          Host $host;
      proxy_set_header          X-Real-IP $remote_addr;
      proxy_set_header          X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout        300s;
      proxy_send_timeout        300s;
      # não bufferiza o body em disco, envia direto ao backend
      proxy_request_buffering   off;
    }
  }
}