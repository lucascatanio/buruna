spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:500}MB
      max-request-size: ${MAX_FILE_SIZE_MB:500}MB

  codec:
    max-in-memory-size: 10MB

resend:
  api-key: ${RESEND_API_KEY:}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME}
    credentials-path: ${GCS_CREDENTIALS_PATH}
  admin-email: ${ADMIN_EMAIL}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jobs:
    # Sem default de propósito: /admin/jobs/** é público e o job apaga arquivos, então
    # a aplicação não sobe sem o segredo em vez de aceitar um valor conhecido.
    secret: ${APP_JOBS_SECRET}
  proxy:
    # Segredo que o nginx do frontend envia em X-Proxy-Secret. Vazio = filtro desligado
    # (dev local e testes). Obrigatório em produção; ver docs/DEPLOYMENT.md e ADR-43.
    secret: ${APP_PROXY_SECRET:}
  pubsub:
    # Obrigatórios fora do profile "local" (PubSubPasswordResetRequests / PubSubPushAuthenticator
    # falham no startup sem eles). Ver docs/DEPLOYMENT.md.
    password-reset-topic: ${APP_PUBSUB_PASSWORD_RESET_TOPIC:}
    push-audience: ${APP_PUBSUB_PUSH_AUDIENCE:}
    push-service-account: ${APP_PUBSUB_PUSH_SERVICE_ACCOUNT:}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  rate-limit:
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
    login-per-hour: ${RATE_LIMIT_LOGIN_PER_HOUR:10}
    feedback-per-hour: ${RATE_LIMIT_FEEDBACK_PER_HOUR:3}
    forgot-password-per-hour: ${RATE_LIMIT_FORGOT_PASSWORD_PER_HOUR:3}
    delete-account-per-hour: ${RATE_LIMIT_DELETE_ACCOUNT_PER_HOUR:5}
  hcaptcha:
    # Default vazio só é aceito com o profile "local" ativo (CaptchaService falha
    # no startup fora dele).
    secret: ${HCAPTCHA_SECRET:}
  mail:
    from: ${APP_MAIL_FROM:Burūna <noreply@buruna.com.br>}
  upload:
    max-file-size-mb: ${MAX_FILE_SIZE_MB:500}
  ingest:
    # Cloud Run Job que extrai as páginas dos capítulos enviados, no formato
    # projects/<projeto>/locations/<região>/jobs/<job>. Obrigatório fora do profile "local",
    # onde o processamento roda na própria requisição. Ver docs/DEPLOYMENT.md.
    job-name: ${APP_INGEST_JOB_NAME:}
    # Limites ao abrir um CBZ enviado por usuário (zip bomb, arquivo malicioso).
    max-pages: ${APP_INGEST_MAX_PAGES:1000}
    max-total-mb: ${APP_INGEST_MAX_TOTAL_MB:1024}
    max-page-mb: ${APP_INGEST_MAX_PAGE_MB:50}
  security:
    # Quantos saltos de proxy confiável (infra própria) precedem a entrada do
    # cliente no X-Forwarded-For. Ver docs/DEPLOYMENT.md.
    trusted-proxy-hops: ${APP_TRUSTED_PROXY_HOPS:1}
  auth:
    # Atributo Secure do cookie httpOnly de refresh token. false só em
    # application-local.yml (dev local roda em HTTP puro).
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: ${SWAGGER_ENABLED:false}