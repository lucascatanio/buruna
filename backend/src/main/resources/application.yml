spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:500}MB
      max-request-size: ${MAX_FILE_SIZE_MB:500}MB

  codec:
    max-in-memory-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME}
    credentials-path: ${GCS_CREDENTIALS_PATH}
  admin-email: ${ADMIN_EMAIL}
  jobs:
    secret: ${APP_JOBS_SECRET:dev-secret-change-me}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  rate-limit:
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
    login-per-hour: ${RATE_LIMIT_LOGIN_PER_HOUR:10}
    feedback-per-hour: ${RATE_LIMIT_FEEDBACK_PER_HOUR:3}
  mail:
    from: ${APP_MAIL_FROM:noreply@localhost}
  upload:
    max-file-size-mb: ${MAX_FILE_SIZE_MB:500}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: ${SWAGGER_ENABLED:true}