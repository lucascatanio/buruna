spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE_MB:500}MB
      max-request-size: ${MAX_FILE_SIZE_MB:500}MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME}
    credentials-path: ${GCS_CREDENTIALS_PATH}
  admin-email: ${ADMIN_EMAIL}
  rate-limit:
    register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}

server:
  port: 8080
  servlet:
    context-path: /api
